<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>추락한 별의 악의 레이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/raid.css?v=20261121b">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>【추락한 별의 악의】 레이드</h1><div class="hint" style="margin:3px 0 0" id="subhint">SRPG 턴제 프로토타입 · 파티 전원을 한 사람이 조작 (서버 연결 전 미리보기)</div></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid">
    <div class="card">
      <div class="boss" id="boss"></div>
      <div class="mapbox"><div class="map" id="map"></div>
        <div class="legend"><span style="--c:var(--boss)">공격 A 범위</span><span style="--c:var(--a2)">공격 B 범위</span><span style="--c:color-mix(in srgb,var(--ic) 45%,transparent)">선택 가능</span></div></div>
      <div class="ctrl" id="ctrl"></div>
    </div>
    <div>
      <div class="card"><div class="party" id="party"></div></div>
      <div class="card" style="margin-top:12px">
        <div class="opts"><label><input type="checkbox" id="fast"> 빠른 진행</label></div>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script src="js/raid-battle.js?v=20261121b"></script>
</body>
</html>
